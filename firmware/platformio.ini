; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3_n4]
platform = espressif32@6.12.0
board = esp32-s3-wroom-1-n4
framework = espidf

; Pin the exact toolchain/framework set that was used successfully so the
; project keeps building even when PlatformIO registry ranges move forward.
platform_packages =
  platformio/framework-espidf@3.50500.0
  platformio/toolchain-xtensa-esp-elf@14.2.0+20241119
  platformio/tool-esptoolpy@2.40900.250804
  platformio/tool-cmake@3.30.2
  platformio/tool-ninja@1.9.0

board_build.psram = disabled

lib_deps =
  https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#509a920cadff634612e8972158e1c293c9f372c7

build_type = debug
upload_protocol = esptool
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

board_build.embed_files = object_pool/StandardPool.iop
