<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISOBUS Dummy – CAD Viewer (Modell 2)</title>

  <style>
    :root {
      --bg: #0e0e11;
      --panel: #15151c;
      --border: #2a2a36;
      --text: #e6e6eb;
      --muted: #9aa0a6;
      --accent: #4da3ff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #15151c, #101014);
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    header span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    main {
      height: calc(100% - 64px);
      padding: 16px;
    }

    .viewer-container {
      height: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02),
        0 20px 60px rgba(0,0,0,0.6);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    footer {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.7;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>ISOBUS Dummy PCB – CAD </h1>
    <span>Fusion 360</span>
  </header>

  <main>
    <div class="viewer-container">
      <iframe
        src="https://stud33185.autodesk360.com/shares/public/SH28cd1QT2badd0ea72b80b96aa83aa32d66?mode=embed"
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen
        loading="lazy">
      </iframe>
    </div>
  </main>

  <footer>
    Embedded via Autodesk Viewer
  </footer>

</body>
</html>
